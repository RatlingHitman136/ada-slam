# TRANSFER TEST: THE PEDESTAL RECIPE ON FRAMES 1000-2000 (14.9). Same scene, same tracking config
# (fg2 * a05), a WINDOW THE PEDESTAL WAS NEVER TUNED ON. `scene_key` (pipeline.py:27) derives the
# tree `kitti_00_fg2a05_f1000-2000`, which starts EMPTY - so unlike every f0-1000 sweep, nothing
# here is reused and every arm below is new GPU time.
#
# WHAT f0-1000 ESTABLISHED, and what is actually being transferred:
#
#   arm                      ATE     drift    what it is
#   base                    15.627   0.507    no transform: the window's raw scale inflation
#   omni                    11.403   0.598
#   omni@ceil1p45            3.830   0.990    best omni arm
#   base@ped1                3.700   0.983    BEST ARM ON RECORD - untrained, no clamp
#   base@ped1p35            (~6.9)  (~0.72)   interpolated; the live arm's matched control
#   live@ped1p35             3.734   1.079    best live arm - but see the caveat below
#
# `|drift-1|` ranks ATE across all 40 scored arms in that tree, Spearman 0.984, over three
# transform families and trained/untrained alike. So THE TRANSFER QUESTION IS ABOUT DRIFT, not
# about ATE: does a window whose raw inflation differs from 0.507 still want R = 1.0?
#
# THE CAVEAT THAT SHAPES THIS FILE. The f0-1000 live sweep does NOT respond to R. Over
# R = 1.15/1.25/1.35/1.4/1.45 it read ATE 5.587/6.055/3.734/5.340/4.627 and drift
# 1.235/1.266/1.079/1.216/1.147 - Spearman(R, drift) = -0.60, p = 0.28, against -0.93, p = 0.0009
# for the untrained arms over a comparable span. The untrained curve is a curve; the live curve is
# scatter spanning 2.3 m of ATE. So `live@ped1p35 = 3.734` may well be a lucky draw, and R = 1.35
# is used here NOT because it is believed optimal but because it is the value f0-1000 would have
# made you pick. That makes this a genuine transfer test AND a partial replication: if this window
# lands near 5 like 1.35's neighbours did, 3.734 was noise.
#
# THE FIVE ARMS, and why each is here:
#   omnidata            - default omni. Its drift is the window's omni baseline
#   vggt_base           - default vggt. THE most informative single number in the run: its drift
#                         says how much scale inflation THIS window has (0.507 on f0-1000) and
#                         therefore which way the optimal R must move
#   vggt_base@ped1      - the untrained optimum, transferred verbatim
#   vggt_base@ped1p35   - the EXACT matched no-training control for the live arm. With @ped1 it
#                         also gives the local drift slope, so 14.6's own recipe ("run two, read
#                         their drift, interpolate to 1.0") locates this window's crossing in one
#                         shot rather than needing another sweep
#   omnidata@ceil1p45   - the best omni arm. The campaign's headline is "beat vggt base AND omni",
#                         which cannot be checked on a new window without it. Drop this ONE entry
#                         for the minimum run (-6 min)
#
# THE LIVE ARM trains FROM STOCK (`ADAPT_INIT_NAME: null`), so this tests the RECIPE transferring,
# not the adapter. The obvious follow-up - deliberately not here - is a second live arm with
# `ADAPT_INIT_NAME: live_fg2a05ped1p35_e5_w10_a16_w12_lag5_base`, pointing at the f0-1000 adapter,
# which tests ADAPTER transfer instead.
#
# ONLINE_NAME IS DELIBERATELY THE SAME STRING as the f0-1000 arm. That is not a collision:
# ADAPT_OUT and OUT_END2END are both keyed by SCENE_KEY (online_adapt_pipeline.py:106-109), so the
# two live in separate trees, and matching names make the cross-window pair obvious in any export.
#
#   python scripts/online_adapt_pipeline.py -c live_fg2a05_f1k2k_ped1p35_e5
#
# RUN THE WINDOW SANITY CHECK FIRST, before the ~2 h burn: set `STAGES: [end2end]` and cut
# END2END_PRIORS to `[omnidata]` (~6 min). Confirm the tree appears, `results.json` says
# `n_all: 1000`, and evo associated against the full 4541-row traj_tum.txt with no frame offset -
# evo matches by TIMESTAMP, and a silent offset is the one thing a windowed run can get wrong.
# Then restore both lines. (`rellis_00000_f200-2647` is the precedent that windows work.)
#
# COST: 5 end2end arms at ~6 min + ~95 min live, about 2 h. Nothing is reused - new tree.
# CHECK `ped_stats.json` `p95_shrink >= 1%` per @ped arm before reading any ATE (f0-1000 read
# 44-48%). NOTE the live arm writes NO ped_stats.json - online/prior.py:serve calls
# pedestal_shift directly and never builds a PedestalPrior, so nothing records what it served.

# ---------------------------------------------------------------- data (preprocessing is NOT here)
SCENE: kitti_00_fg2a05
DATA: data/KITTI/00                   # preprocess_kitti.py's output layout
COLORS: data/KITTI/00/colors          # the four paths below are spelled out rather than derived
DEPTHS: null                          # from DATA - change them together. KITTI ships no GT depth
GT_TRAJ: data/KITTI/00/traj_tum.txt   # all 4541 frames; evo associates the window by timestamp
CALIB: data/KITTI/00/calib.txt
CONFIG: config/kitti_fg2_a05_config.yaml   # alpha 0.05 * far_gain 2 - unchanged from f0-1000
DROID_WEIGHTS: pretrained_models/droid.pth
UNDISTORT: false                      # undistort offline in the preprocess script instead (10.1)
CROP_BORDER: 0

# ---------------------------------------------------------------- run control
STAGES: [online, end2end]             # -> [end2end] for the sanity pass described above
SKIP_EXISTING: true                   # nothing to skip on the first run - the tree is empty
MIN_FREE_VRAM_MB: 15000               # raise with BUFFER on a bigger card
GPU_WAIT_MIN: 120                     # minutes to WAIT for that much VRAM instead of
                                      # refusing; 0 = refuse immediately. Polls every 60 s
LENGTH: 100000                        # uncapped; STOP defines the window
START: 1000                           # >>> THE WINDOW. All 4541 colors/depths/GT rows exist
STOP: 2000                            # exclusive -> frames 1000..1999, 1000 frames like f0-1000
STREAM_RES: 218240                    # 341 * 640 - a pixel budget, not a shape (9.6)
BUFFER: 1500                          # keyframe buffer; a HARD CAP with no overflow guard
RENDER_EVAL: false                    # hi2.py's eval_rendering -> renders/ + psnr/ (11)

# ---------------------------------------------------------------- names and lineage
OUT_ROOT: outputs
# the SAME name as the f0-1000 arm, on purpose - SCENE_KEY separates the trees (see the header)
ONLINE_NAME: live_fg2a05ped1p35_e5_w10_a16_w12_lag5_base
ADAPT_INIT_NAME: null                 # from stock VGGT-1B: this tests the RECIPE, not the adapter
VGGT_HW: null                         # null = derive | [378, 518] TUM | [294, 518] Replica

# ---------------------------------------------------------------- reference arms (stage 2)
# ALL FIVE ARE NEW - the tree starts empty, so there is no free reference here. See the header for
# what each one answers. Read their DRIFT first; the ATE ranking follows from |drift-1|.
END2END_PRIORS: [omnidata, omnidata@ceil1p45, vggt_base, vggt_base@ped1, vggt_base@ped1p35]
SPLIT_AT: null                          # null = the whole run, so [unseen] is empty (12.2)

# ---------------------------------------------------------------- the adapter structure
# byte-identical to every f0-1000 live arm, so the window is the only variable
lora:
  weights: pretrained_models/vggt
  rank: 8
  alpha: 16
  targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
  patch_embed: false                  # false = adapt only the alternating-attention stack

# ---------------------------------------------------------------- online adaptation (stage 1)
# every field identical to the f0-1000 recipe: the window is the experiment, not the knobs
online:
  # warm-up: TWO gates - when the adapter starts LEARNING, and when it starts SERVING
  warmup_kf: 12                       # keyframes before the first optimiser step, which lands at +1
  handover_kf: 12                     # keyframes served by the FALLBACK prior; must be >= warmup_kf
  warmup_prior: omnidata              # 'omnidata' = upstream's prior | 'self' = the adapting VGGT
                                      # omni is much tailier (p95/med 4.22 vs base 2.67), so these
                                      # 12 keyframes serve 1.780, not stock VGGT's 1.561
  # schedule
  adapt_style: wonline                # 'online' = the arrival alone | 'wonline' = a sliding window
  steps_per_kf: 5                     # e5: e20 bought nothing over e5 at ceil1p5 (14.6)
  window_size: 10                     # 'wonline' ONLY
  batch_size: 2                       # 'wonline' ONLY
  lag: 5                              # keyframes back from the end the target is taken
  # serving
  ceil_ratio: 1.0                     # OFF. No clamp on either branch - on f0-1000 the pedestal
                                      # alone beat the clamp and the two stacked (3.700 vs 5.018)
  ceil_target: false                  # forced: ceil_target at ceil_ratio 1.0 is refused
  ped_ratio: 1.35                     # >>> THE TRANSFERRED KNOB. Served depth saturates at 1.35x
                                      # the frame's PRE-shift median = 2.35x its POST-shift median.
                                      # Stock VGGT under this serves a 1.561 tail; the f0-1000
                                      # UNTRAINED peak was 1.455, and the gap is the compensation
                                      # for the prior flattening as it trains (2.670 -> ~2.25).
                                      # Chosen as "what f0-1000 would have made you pick", NOT as
                                      # a believed optimum - the live sweep had p = 0.28 on R.
                                      # Applied to both branches, warm-up included; the training
                                      # target carries it on neither, which is why the adapter
                                      # cannot learn the bias and instead erases its own
  # sample construction
  context_kf: 0                       # previous KEYFRAMES appended after the target; 0 = monocular
                                      # also the reason intrinsics never reach the adapter: K only
                                      # enters via pose_encoding, which is skipped below 2 frames
  # optimisation
  lr: 1.0e-4                          # NOT 1e-4 - YAML reads that as a string
  weight_decay: 0.0
  grad_clip: 1.0
  lambda_pose: 1.0
  coupled_scale: true
  min_mask_pixels: 16
  seed: 0
  log_every: 5
  # supervision mask (the same knobs ExtractConfig uses for depth_slam/)
  mask_filter_thresh: 0.005
  mask_min_count: 2
  mask_min_disp_ratio: 0.5            # 14.9 measured the mask as exactly zero past 30 m, so the
                                      # far field - all the pedestal touches - is unsupervised
  # the loss gate: skip an arrival whose newest keyframe is not worth training on
  gate_metric: raw                    # 'rel' = flat across a run | 'raw' = drifts with it
  gate_lo: 0.0                        # 0 = off; skip BELOW this - the target already fits
  gate_hi: 0.0                        # 0 = off; skip ABOVE this - the target is broken, not hard
  # output
  checkpoint_every_kf: 0              # 0 = off; N = a loadable adapter dir every N
                                      # adapted keyframes

# ---------------------------------------------------------------- what scores the arms
end2end:
  omni_normal_ckpt: pretrained_models/omnidata_dpt_normal_v2.ckpt
  omni_normal_hw: [512, 512]
