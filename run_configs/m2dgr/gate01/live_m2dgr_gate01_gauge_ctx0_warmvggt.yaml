# M2DGR gate_01, gauge ctx0 - WARM-UP ON VGGT-BASE instead of Omnidata.
#
#   python scripts/online_adapt_pipeline.py -c m2dgr/gate01/live_m2dgr_gate01_gauge_ctx0_warmvggt
#
# WHAT CHANGES. warmup_prior: omnidata -> self, and nothing else. For the first handover_kf = 12
# keyframes the tracker is now served by the very VGGT this run adapts, and before the first
# optimiser step (keyframe 13, warmup_kf + 1) that model IS VGGT-base: LoRA's B matrix is
# zero-initialised (adapt/lora.py), so the adapter starts as the identity. Normals stay
# Omnidata's on both branches - online/prior.py reuses the frozen arm's extractor verbatim. So
# keyframes 0-12 get exactly the prior the frozen `base` reference arm gets, and from keyframe 13
# the weights start to move. Note handover_kf is now inert: with 'self' both branches are the same
# model object, so the gate no longer switches models.
#
# WHY. With the Omnidata warm-up two things happen at handover at once: the served depth jumps
# from one model family to another, AND the adapter starts moving. Warming up on VGGT-base
# removes the model switch, so the only thing that changes at handover is adaptation itself. It
# also moves where the map's scale starts, because the first keyframes are now VGGT's.
#
# A BUILT-IN CHECK. Until keyframe 13 this arm and the frozen `base` arm are the same run, so their
# map scale should agree as closely as the live runs agreed with the omni arm through the old
# warm-up (0.5% or better). If it does not, 'self' is not serving what this header says.
#
# WHY GATE_01 IN PARTICULAR. It is where handover mattered most: every seed matched the omni
# arm's map scale to 0.5% through warm-up, then seeds 0 and 2 parted from it within ~30 frames
# of handover (frame 292) and ended far better, while seed 3 and the batch-10 arm stayed
# omni-like for ~1000 frames and ended about as bad. The frozen VGGT arm's map scale already
# sits about 13% from the omni arm's at frame 0, so this arm starts from a different map too.
#
# READ IT AGAINST the seed-0 parent (ATE 7.41 m, lambda sd 0.29) and the frozen VGGT arm
# (9.87 m, 0.96). This is ONE seed on the scene where seeds disagree most - the parent's own
# triplet is 8.81 +/- 1.56 m with lambda sd 0.75 +/- 0.75 - so a single run cannot separate this
# knob from seed luck. It needs its own seeds before it means anything.
#
# Everything below is byte-identical to the parent except ONLINE_NAME and warmup_prior.

# ---------------------------------------------------------------- data (preprocessing is NOT here)
SCENE: m2dgr_gate01_a01fg1            # names the outputs/ tree; the tag records the prior weight
DATA: data/M2DGR/gate_01              # preprocess_m2dgr.py's output layout
COLORS: data/M2DGR/gate_01/colors     # the four paths below are spelled out rather than derived
DEPTHS: data/M2DGR/gate_01/depths     # from DATA - change them together. Velodyne VLP-32C
                                      # projected into the camera, uint16 / 256 = metres; unread
                                      # by this driver, but check_sequence asserts it is 1:1 with
                                      # colors, which is a free guard against a half-written
                                      # preprocess
GT_TRAJ: data/M2DGR/gate_01/traj_tum.txt   # camera-to-world in a local ENU frame, RTK/INS with
                                      # the 0.409 m body->camera lever arm applied
CALIB: data/M2DGR/gate_01/calib.txt   # fx fy cx cy; distortion is removed from the IMAGES offline
CONFIG: config/m2dgr_config.yaml      # alpha 0.01, far_gain 1.0 - upstream's default, per the ask
DROID_WEIGHTS: pretrained_models/droid.pth
UNDISTORT: false                      # already undistorted by the preprocess (10.1)
CROP_BORDER: 0

# ---------------------------------------------------------------- run control
STAGES: [online, end2end]
SKIP_EXISTING: true
MIN_FREE_VRAM_MB: 20000               # HIGHER than the KITTI arms' 15000, and not arbitrary:
                                      # VGGT runs at 1036 patch tokens per frame here against
                                      # KITTI's 444, so the 6.19 GiB training peak measured there
                                      # does not hold. 20 GiB of a 24 GiB card is the honest ask;
                                      # if it never clears on this shared box, drop BUFFER first
                                      # (below) rather than this.
GPU_WAIT_MIN: 240                     # minutes to WAIT for that much VRAM instead of refusing;
                                      # 0 = refuse immediately. Polls every 60 s. Raised because
                                      # 20 GiB is a bigger ask than the KITTI arms made.
LENGTH: 100000
START: 0
STOP: 2060                            # exclusive - the RTK re-initialisation is at this frame;
                                      # see the header. null would run into a broken ground truth
STREAM_RES: 218240                    # 341 * 640, a pixel budget, not a shape (9.6). On this
                                      # 640x480 source it resolves to a 400x536 stream - almost
                                      # exactly KITTI's 256x848 = 217088 px, so the per-keyframe
                                      # buffer cost carries over unchanged
BUFFER: 1000                          # keyframe buffer; a HARD CAP with no overflow guard. At
                                      # ~2.5 MiB GPU + 4.8 MiB CPU per slot that is 2.4 + 4.7 GiB.
                                      # 1000 is deliberate headroom, not an estimate: KITTI 00
                                      # makes a keyframe every ~1.65 m, and gate_01's whole scored
                                      # window is 122.5 m of path, so even at a keyframe every
                                      # 30 cm this run needs ~400 slots. Raise it if the run
                                      # reports more keyframes than this - it will not warn.
RENDER_EVAL: false                    # hi2.py's eval_rendering -> renders/ + psnr/ (11)

# ---------------------------------------------------------------- names and lineage
OUT_ROOT: outputs
ONLINE_NAME: live_a01fg1_e5_w10_a16_w12_lag5_gauge_ctx0_warmvggt
ADAPT_INIT_NAME: null                 # an adapt experiment in this scene to CONTINUE from
VGGT_HW: null                         # null = DERIVE from the stream's aspect, which is right
                                      # here: a 400x536 stream is 0.746, inside VGGT's trained
                                      # band, so it maps to 392x518 with the field of view intact
                                      # and nothing squashed. The KITTI arms pin [196, 518] only
                                      # because they must match an existing baseline adapter;
                                      # this scene has no such obligation.

# ---------------------------------------------------------------- reference arms (stage 2)
END2END_PRIORS: [omnidata, vggt_base]   # [0] is the baseline column. These are the "1 omni" and
                                        # "1 vggt" arms; the third is ONLINE_NAME's _live
SPLIT_AT: null                          # null = the whole run, so [unseen] is empty (12.2)

# ---------------------------------------------------------------- the adapter structure
lora:
  weights: pretrained_models/vggt
  rank: 8                             # the KITTI gauge family's rank; rank 16 was tried there and
  alpha: 16                           # is not yet read out, so 8 keeps this a transfer test of
  targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]   # ONE variable rather than two
  patch_embed: false                  # false = adapt only the alternating-attention stack

# ---------------------------------------------------------------- online adaptation (stage 1)
online:
  # warm-up: TWO gates - when the adapter starts LEARNING, and when it starts SERVING
  warmup_kf: 12                       # keyframes before the first optimiser step, which lands at +1
  handover_kf: 12                     # keyframes served by the FALLBACK prior; must be >= warmup_kf
  warmup_prior: self                  # CHANGED from omnidata: the VGGT this run adapts,
                                      # which is VGGT-base until the first optimiser
                                      # step (LoRA B starts at zero) - see the header
  # schedule
  adapt_style: wonline                # 'online' = the arrival alone | 'wonline' = a sliding window
  steps_per_kf: 5                     # 5 passes x window 10 / batch 2 = 25 steps per unit
  window_size: 10                     # 'wonline' ONLY
  batch_size: 2                       # 'wonline' ONLY
  lag: 5                              # keyframes back from the end the target is taken
  # serving
  ceil_ratio: 1.0                     # far-field ceiling on the SERVED depth (14): clamp at this
                                      # x the frame median, warm-up branch included; 1.0 = off.
                                      # OFF on purpose - the ceiling and pedestal family is a
                                      # separate axis from adaptation and was explicitly scoped
                                      # out of the gauge question
  ceil_target: false                  # true = clamp the TRAINING target at ceil_ratio too (14.6);
                                      # refused at ceil_ratio 1.0, where it would do nothing
  ped_ratio: null                     # far-field PEDESTAL on the SERVED depth (14.9). null = off -
                                      # NOT 1.0, which is a real pedestal; the two knobs differ
  # sample construction
  context_kf: 0                       # ctx0, as asked: monocular and depth-only, the pre-knob
                                      # behaviour exactly
  context_stride: 1                   # keyframes BETWEEN context frames; inert at context_kf 0
  # optimisation
  lr: 1.0e-4                          # NOT 1e-4 - YAML reads that as a string
  weight_decay: 0.0
  grad_clip: 1.0
  normalize_target: true              # THE VARIABLE: divide the target by the sample's own gauge
  gauge_clamp: 2.0                    # and hand depth_loss scale=1.0 instead of letting it fit
  gauge_min_pixels: 256               # one, so the loss finally carries gradient about ABSOLUTE
  gauge_pose: false                   # scale. gauge_pose needs lambda_pose > 0; inert here
  lambda_pose: 0.0                    # NO POSE, as asked. Also forced: config.py refuses
                                      # lambda_pose > 0 alongside normalize_target, because
                                      # pose_loss normalises translations by their own mean norms
                                      # - a DIFFERENT gauge from the target's. And it is not a
                                      # second variable anyway: at context_kf 0 pose_loss returns
                                      # zeros and pose_scale is None, so 0.0 and 1.0 are
                                      # numerically identical here
  coupled_scale: false                # required by lambda_cons; numerically inert at ctx0
  freeze_gauge: false                 # hold the pose gauge fixed for the whole unit instead of
                                      # recomputing it every forward
  anchor_kf: 0                        # off - normalize_target replaces it, and the two are
                                      # refused together
  depth_all_frames: false             # needs context_kf >= 1
  lambda_cons: 0.0                    # off - it penalised inconsistency ON TOP of the scale
                                      # invariance normalize_target removes outright
  batch_scale: false                  # one scale over the WHOLE batch; refused with coupled_scale
  min_mask_pixels: 16
  seed: 0
  log_every: 5
  # supervision mask (the same knobs ExtractConfig uses for depth_slam/)
  mask_filter_thresh: 0.005
  mask_min_count: 2
  mask_min_disp_ratio: 0.5
  # the loss gate: skip an arrival whose newest keyframe is not worth training on
  gate_metric: raw                    # 'rel' = flat across a run | 'raw' = drifts with it
  gate_lo: 0.0                        # 0 = off; skip BELOW this - the target already fits
  gate_hi: 0.0                        # 0 = off; skip ABOVE this - the target is broken, not hard
  gate_scope: arrival                 # 'arrival' = the band on the newest keyframe, once per unit | 'sample' = on every training sample
  # the unit breaker: skip a unit whose whole window has gone bad (online/config.py)
  breaker_k: 0.0                      # 0 = off; else > 1 - window median loss > k x the recent median
  breaker_window: 100                 # untripped units the reference median spans
  breaker_warmup: 40                  # units that only feed the reference
  breaker_serve: adapted              # 'adapted' | 'base' - what the tracker is served while the breaker is tripped
  # output
  checkpoint_every_kf: 0              # 0 = off; N = a loadable adapter dir every N adapted
                                      # keyframes

# ---------------------------------------------------------------- what scores the arms
end2end:
  omni_normal_ckpt: pretrained_models/omnidata_dpt_normal_v2.ckpt
  omni_normal_hw: [512, 512]
