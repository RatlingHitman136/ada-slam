# ONE SCALE OVER THE BATCH - the first objective that can see the quantity the ATE measures.
#
# THE DIAGNOSIS. depth_loss aligns scale INSIDE each sample before measuring the residual; the
# invariance is exact, verified bit-identical at c = 0.5 / 1 / 2 / 10. So scale disagreement
# BETWEEN keyframes costs the objective nothing - and that disagreement is the entire ATE. Over
# eleven arms corr(local-scale sd, ATE) = 0.977 at ~66 m per unit of sd; within a seed triplet of
# one config it is 0.997. The loss has been blind to the only thing being scored.
#
# WHAT THIS CHANGES. batch_scale fits ONE median-ratio gauge across all 10 keyframes of the batch
# and measures every sample against it, so a keyframe whose scale has walked away from the others
# now carries a residual. At batch_size 10 the batch IS the wonline window: 10 keyframes, ~16 m,
# carrying ~1.4% of the sequence's drift.
#
# WHY coupled_scale IS OFF. The two are mutually exclusive (config.py refuses them together) and
# coupled_scale is the one with evidence against it: gauged by pose_scale, recomputed from the
# camera head on EVERY forward, the target moves under the optimiser. Sorted by that flag -
#
#   run                    cs      loss level   last/BEST   best step
#   ctx0   (lp inert)     n/a         0.041       1.002        21 of 24
#   nopose (lp 0)        FALSE        0.039       1.034        23 of 24
#   cscale (lp 0)         TRUE        0.277       1.147        21
#   lp2    (lp 2)         TRUE        0.222       1.114        12
#
# - FALSE converges at the END of the unit and sits 6-7x lower. batch_scale keeps that property:
# the gauge is detached and constant for the step.
#
# WHY IT IS WORTH THE COMPUTE. The frozen replays showed the four batch-10 adapters are not
# variations on one thing - they are 15.976 / 10.317 / 16.457 / 15.336 against the vggt_base
# 15.627 they all started from, a spread of 6.1 m at 38x the +-0.075 m frozen-arm floor. Three of
# four learned nothing useful; one beat omni. That is a lottery, not an optimisation, and the
# reason is that nothing in the gradient points at cross-frame consistency. This is the change
# that makes it point there.
#
# COST: one extra no-grad forward per sample, so ~2x the step time - the gauge must be known
# before the graph is built. 100 forwards per unit against the b10 runs' 50.
#
# READ, IN ORDER.
#   1 the within-unit curve. b10 with coupled_scale gave last/BEST 1.000-1.026 but a FLAT curve
#     (1.000 -> 0.97-1.01 over five clean steps). If the loss now actually descends, the objective
#     has something to optimise for the first time.
#   2 train_log's new `batch_scale` field - the fitted gauge per step. If it is stable across a
#     unit the window is self-consistent; if it jumps, the targets disagree and that IS the signal
#     being introduced.
#   3 ATE last, and against the b10 mean 11.886 (sd 2.003, n=4) - never against a single run.
#
# Everything else is the b10 seed-0 config verbatim: rank 16 / alpha 32, ctx 2 stride 1,
# lambda_pose 2, lr 1.0e-4, wonline 5 passes / window 10 / batch 10, lag 5, gate off, no tail.
#
#
# SEED 2, the second of three. The seed-0 arm is live_b10_bscale; this one changes nothing but
# OnlineConfig.seed, which drives LoRALinear.A's kaiming init (the constructor - 9.5) and
# LiveTrainer's rng, so it is an independent draw of both the adapter's starting point and the
# order it sees keyframes in. The prior still snapshots and restores the global RNG around
# construction, so the SLAM run sees the stream a base arm would (13.5).
#
# WHY THREE. A single live arm is uninterpretable here: the batch-10 family scored 10.575 /
# 10.401 / 11.835 / 14.733 across seeds, sd 2.003 m, and the batch-2 family 9.991 / 12.886 /
# 14.107, sd 2.114 m. Reducing gradient noise 5x did not touch that spread, so it is not gradient
# noise - it is the self-training loop compounding through 425 units, and it applies to this arm
# too until shown otherwise. Seeds 0/2/3 here pair one-for-one with the b10 seeds 0/2/3
# (10.575 / 10.401 / 11.835), so the comparison is like-for-like rather than against a mean.
#
# AND READ THE TRAINING SIGNAL FIRST, not the ATE. Three runs cannot resolve a 2 m difference in
# means - the seeds-per-arm table says ~18 for 2 m at 80% power. What three runs CAN settle is
# whether the within-unit curve descends, because that is measured over ~2000 optimiser steps per
# run rather than over one trajectory, and it either happens in all three or it does not happen.
#
#   python scripts/online_adapt_pipeline.py -c live_b10_bscale_r2

# ---------------------------------------------------------------- data (preprocessing is NOT here)
SCENE: kitti_00_fg2a05
DATA: data/KITTI/00                   # preprocess_kitti.py's output layout
COLORS: data/KITTI/00/colors          # the four paths below are spelled out rather than derived
DEPTHS: null                          # from DATA - change them together. KITTI ships no GT depth
GT_TRAJ: data/KITTI/00/traj_tum.txt
CALIB: data/KITTI/00/calib.txt
CONFIG: config/kitti_fg2_a05_config.yaml   # alpha 0.05 * far_gain 5 -> 0.05 near .. 0.25 far.
                                      # config/kitti_config.yaml is upstream's flat 0.01
DROID_WEIGHTS: pretrained_models/droid.pth
UNDISTORT: false                      # undistort offline in the preprocess script instead (10.1)
CROP_BORDER: 0

# ---------------------------------------------------------------- run control
STAGES: [online, end2end]
SKIP_EXISTING: true
MIN_FREE_VRAM_MB: 15000               # raise with BUFFER on a bigger card
GPU_WAIT_MIN: 120                     # minutes to WAIT for that much VRAM instead of
                                      # refusing; 0 = refuse immediately. Polls every 60 s
LENGTH: 100000
START: 0
STOP: 1000                            # exclusive; null = to the end of the sequence
STREAM_RES: 218240                    # 341 * 640 - a pixel budget, not a shape (9.6)
BUFFER: 1500                          # keyframe buffer; a HARD CAP with no overflow guard. At
                                      # ~2.5 MiB GPU + 4.8 MiB CPU per slot this is 6.1 + 11.6 GiB
RENDER_EVAL: false                    # hi2.py's eval_rendering -> renders/ + psnr/ (11)

# ---------------------------------------------------------------- names and lineage
OUT_ROOT: outputs
ONLINE_NAME: live_fg2a05_e5_w10_r16a32_w12_lag5_ctx2_lp2_b10_bscale_r2   # unique within its scene only
ADAPT_INIT_NAME: null                 # an adapt experiment in this scene to CONTINUE from
VGGT_HW: null                   # null = derive | [378, 518] TUM | [294, 518] Replica

# ---------------------------------------------------------------- reference arms (stage 2)
END2END_PRIORS: [omnidata, vggt_base, vggt_base@ctx2]   # [0] is the baseline column
SPLIT_AT: null                          # null = the whole run, so [unseen] is empty (12.2)

# ---------------------------------------------------------------- the adapter structure
lora:
  weights: pretrained_models/vggt
  rank: 16                            # 8 -> 16: ~6.29 M -> ~12.6 M trainable
  alpha: 32                           # MOVES WITH RANK - LoRALinear scales by
                                      # alpha/rank (lora.py:18), so 32/16 keeps
                                      # the 2.0 the rank-8 arms ran. Capacity is
                                      # then the only variable.
  targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
  patch_embed: false                  # false = adapt only the alternating-attention stack

# ---------------------------------------------------------------- online adaptation (stage 1)
online:
  # warm-up: TWO gates - when the adapter starts LEARNING, and when it starts SERVING
  warmup_kf: 12                       # keyframes before the first optimiser step, which lands at +1
  handover_kf: 12                     # keyframes served by the FALLBACK prior; must be >= warmup_kf
  warmup_prior: omnidata              # 'omnidata' = upstream's prior | 'self' = the adapting VGGT
  # schedule
  adapt_style: wonline                # 'online' = the arrival alone | 'wonline' = a sliding window
  steps_per_kf: 5
  window_size: 10                     # 'wonline' ONLY
  batch_size: 10                      # THE variable: 2 -> 10, the WHOLE window
                                      # in one averaged gradient. Same total
                                      # forwards (steps_per_kf * window_size =
                                      # 50), 5 optimiser steps instead of 25
  lag: 5                              # keyframes back from the end the target is taken
  # serving
  ceil_ratio: 1.0                     # far-field ceiling on the SERVED depth (14):
                                      # clamp at this x the frame median, warm-up
                                      # branch included; 1.0 = off
  ceil_target: false                  # true = clamp the TRAINING target at ceil_ratio too (14.6);
                                      # refused at ceil_ratio 1.0, where it would do nothing
  ped_ratio: null                     # far-field PEDESTAL on the SERVED depth (14.9): the served
                                      # depth saturates at this x the frame's PRE-SHIFT median,
                                      # applied AFTER the ceiling. null = off - NOT 1.0, which is
                                      # a real pedestal; the two knobs' off values differ.
  # sample construction
  context_kf: 2                       # frames per VGGT forward minus one, TRAINING and SERVING
  context_stride: 1                   # consecutive keyframes
  context_stride: 1                   # consecutive keyframes - the stride arms are
                                      # a separate axis and are not varied here
                                      # both -> S = 3. THE one change against live_default
  # optimisation
  lr: 1.0e-4                          # NOT 1e-4 - YAML reads that as a string
  weight_decay: 0.0
  grad_clip: 1.0
  normalize_target: false             # true = divide the target by the sample's own gauge
  gauge_clamp: 2.0                    # and stop depth_loss re-fitting a scale, so the loss
  gauge_min_pixels: 256               # carries gradient about ABSOLUTE scale. Unread when
  gauge_pose: false                   # gt TRANSLATIONS in the depth target's gauge, compared
                                      # directly - VGGT's own camera term. Needs
                                      # normalize_target and lambda_pose > 0
                                      # normalize_target is false, but still validated
  lambda_pose: 2.0
  coupled_scale: false                # OFF - mutually exclusive with batch_scale, and
  freeze_gauge: false                 # hold the pose gauge fixed for the whole unit
                                      # instead of recomputing it every forward
                                      # the gauge with evidence against it
  anchor_kf: 0                        # keyframes from the start of the sequence that
                                      # lambda_cons measures against; 0 = the batch
  depth_all_frames: false             # supervise depth on every frame of the sample
                                      # under one shared scale; needs context_kf >= 1
  lambda_cons: 0.0                    # scale-consistency penalty; pulls each sample's
                                      # own scale toward the batch consensus. 0 = off
  batch_scale: true                   # THE variable: ONE gauge across all 10 keyframes
                                      # of the batch, so cross-keyframe scale
                                      # disagreement finally enters the residual
  min_mask_pixels: 16
  seed: 2                             # the ONLY change vs live_b10_bscale
  log_every: 5
  # supervision mask (the same knobs ExtractConfig uses for depth_slam/)
  mask_filter_thresh: 0.005
  mask_min_count: 2
  mask_min_disp_ratio: 0.5
  # the loss gate: skip an arrival whose newest keyframe is not worth training on
  gate_metric: raw                    # 'rel' = flat across a run | 'raw' = drifts with it
  gate_lo: 0.0                      # 0 = off; skip BELOW this - the target already fits
  gate_hi: 0.0                        # 0 = off; skip ABOVE this - the target is broken, not hard
  gate_scope: arrival                 # 'arrival' = the band on the newest keyframe, once per unit | 'sample' = on every training sample
  # the unit breaker: skip a unit whose whole window has gone bad (online/config.py)
  breaker_k: 0.0                      # 0 = off; else > 1 - window median loss > k x the recent median
  breaker_window: 100                 # untripped units the reference median spans
  breaker_warmup: 40                  # units that only feed the reference
  breaker_serve: adapted              # 'adapted' | 'base' - what the tracker is served while the breaker is tripped
  # output
  checkpoint_every_kf: 0              # 0 = off; N = a loadable adapter dir every N
                                      # adapted keyframes

# ---------------------------------------------------------------- what scores the arms
end2end:
  omni_normal_ckpt: pretrained_models/omnidata_dpt_normal_v2.ckpt
  omni_normal_hw: [512, 512]
