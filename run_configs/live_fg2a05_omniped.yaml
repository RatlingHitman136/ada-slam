# THE PEDESTAL ON OMNIDATA - QUESTION CLOSED (14.9). STAGES is [end2end] only, and NO ARM HERE IS
# UNRUN: this file is now the record of a finished sweep, kept because re-running it rebuilds any
# arm that is deleted and because the table below is the argument.
#
# THE FULL CURVE. Monotone in R throughout - unlike the live sweeps, which were scatter:
#
#   arm             served tail    ATE     drift    |drift-1|
#   omni  (raw)        (none)    11.403    0.598      0.402    <- R = infinity: the pedestal off
#   omni@ped2           2.035     4.139    0.899      0.101
#   omni@ped1p8         1.962   * 3.940 *  1.004      0.004    <- THE CROSSING, and the minimum
#   omni@ped1p6         1.885     5.021    1.198      0.198
#   omni@ped1p4         1.802     5.730    1.240      0.240
#   omni@ped1p2         1.713     7.322    1.338      0.338
#   omni@ped1           1.617    11.006    1.525      0.525
#   omni@ped0p85        1.540    14.012    1.686      0.686
#   omni@ped0p7         1.458    21.684    2.216      1.216
#   omni@ped0p6         1.401    25.945    2.628      1.628
#
#   omni@ceil1p45       1.450     3.830    0.990      0.010    <- the clamp, at its own optimum
#   base_ped1           1.454     3.687    0.989      0.011    <- VGGT + pedestal, 4-draw mean
#
# ANSWER 1: AT THE CROSSING, THE PEDESTAL AND THE CLAMP TIE ON OMNI. omni@ped1p8 = 3.940 against
# omni@ceil1p45 = 3.830, a gap of 0.11 m inside the measured 0.165 m noise floor (four draws of
# base_ped1 at one config/seed: 3.700 / 3.623 / 3.639 / 3.788, std 0.075). "Smooth beats flat" does
# NOT generalise to a prior that already carries the bias - it simply stops mattering.
#
# ANSWER 2, and it is the stronger one: THREE TRANSFORM FAMILIES CONVERGE AT drift ~ 1.0.
# base_ped1 3.687 (VGGT + pedestal), omni_ceil1p45 3.830 (omni + clamp), omni_ped1p8 3.940 (omni +
# pedestal) - a 0.25 m spread across completely different priors and completely different
# transforms. This is the same result the APE correlation shows directly: base_ped1 and
# omni_ceil1p45 agree pose-by-pose at 0.996 Pearson, mean |diff| 0.183 m, while base_ped0p9 (drift
# 1.222) correlates -0.04. ONCE THE CROSSING IS HIT, ONLY THE ROUTE THERE DIFFERS - the residual
# ~3.7-3.9 m is a property of the scene and the tracker, not of the depth prior.
#
# ANSWER 3: THE RATIO IS NOT PORTABLE BETWEEN PRIORS, and the served tail does not make it so.
# omni needs R = 1.8 where VGGT needs R = 1.0, and at the crossing omni serves a tail of 1.962
# against VGGT's 1.454. Worse, compare the two omni rows at a MATCHED tail:
#
#   omni@ceil1p45 serves 1.450 -> drift 0.990, ATE  3.830
#   omni@ped0p7   serves 1.458 -> drift 2.216, ATE 21.684
#
# The same prior, the same served tail, 1.23 of drift and 18 m apart. On VGGT the same comparison
# costs 0.08. A tail percentile is not a sufficient statistic across transform families (14.9), and
# omni is the extreme case that proves it.
#
# WHY OMNI NEEDS SO MUCH LESS PEDESTAL. 14.9 measured that omni's far field is essentially ALL
# pedestal already - subtract its own offset and 55-80 m blows up to 64.8x - so its inherent offset
# b = 0.337 x median(q) is an inherent R of 2.97. @ped1p8 therefore adds only ~1.6x what omni
# already carries, where VGGT at R = 1.0 has to supply nearly everything. And it explains the
# near-field damage at tight R: a clamp truncates omni's uninformative far field and leaves the
# near/mid field alone, while a monotone pedestal cannot truncate and compresses everywhere,
# response(u) = (R+1)/(R+u). At R = 0.7 that damage is what costs 18 m.
#
#   => CLAMP A PRIOR ALREADY SATURATED FAR AWAY (omni); USE A PEDESTAL ON ONE FAITHFUL FAR AWAY
#      (VGGT). Both sides of that rule are now measured - but note answer 2: at the crossing the
#      choice costs nothing either way. It decides how easy the optimum is to FIND, not how good
#      it is.
#
# METHODOLOGICAL NOTE, because it cost three wrong predictions in this one sweep. Every ratio I
# picked by extrapolating the STEEP end of the drift curve was wrong: round 1 put the crossing at
# R = 0.78 (it is 1.8), round 2 predicted drift 0.96-1.04 at R = 1.6 (measured 1.198), round 3
# predicted 1.078 at R = 2.0 (measured 0.899, i.e. the curve then fell FASTER than the fit). These
# curves flatten toward the loose end and then steepen again near the crossing. BRACKET BY
# MEASUREMENT; never extrapolate more than one grid step.
#
#   python scripts/online_adapt_pipeline.py -c live_fg2a05_omniped     # rebuilds anything deleted
#
# IF THE 0.11 m TIE NEEDS FIRMING UP, replicate rather than add ratios - the crossing is already
# bracketed by @ped1p8 (1.004) and @ped2 (0.899) and there is nothing left to locate:
#   python scripts/replicate_arm.py -s kitti_00_fg2a05_f0-1000 -a omni_ped1p8 -c live_fg2a05_omniped -n 2

# ---------------------------------------------------------------- data (preprocessing is NOT here)
SCENE: kitti_00_fg2a05
DATA: data/KITTI/00                   # preprocess_kitti.py's output layout
COLORS: data/KITTI/00/colors          # the four paths below are spelled out rather than derived
DEPTHS: null                          # from DATA - change them together. Unread by this stage
GT_TRAJ: data/KITTI/00/traj_tum.txt
CALIB: data/KITTI/00/calib.txt
CONFIG: config/kitti_fg2_a05_config.yaml   # alpha 0.05 * far_gain 2 - the tree's config
DROID_WEIGHTS: pretrained_models/droid.pth
UNDISTORT: false                      # undistort offline in the preprocess script instead (10.1)
CROP_BORDER: 0

# ---------------------------------------------------------------- run control
STAGES: [end2end]                     # references only - the online stage is skipped entirely
SKIP_EXISTING: true                   # the five reused arms are on disk and cost no GPU
MIN_FREE_VRAM_MB: 15000               # omni arms are lighter than VGGT ones; the tracker dominates
GPU_WAIT_MIN: 120                     # minutes to WAIT for that much VRAM instead of
                                      # refusing; 0 = refuse immediately. Polls every 60 s
LENGTH: 100000
START: 0
STOP: 1000                            # exclusive; the window every number above used
STREAM_RES: 218240                    # 341 * 640 - a pixel budget, not a shape (9.6)
BUFFER: 1500                          # keyframe buffer; a HARD CAP with no overflow guard
RENDER_EVAL: false                    # hi2.py's eval_rendering -> renders/ + psnr/ (11)

# ---------------------------------------------------------------- names and lineage
OUT_ROOT: outputs
ONLINE_NAME: live_omniped             # placeholder: the online stage never runs (STAGES above)
ADAPT_INIT_NAME: null                 # an adapt experiment in this scene to CONTINUE from
VGGT_HW: null                         # null = derive | [378, 518] TUM | [294, 518] Replica

# ---------------------------------------------------------------- the arms (stage 2)
# ALL ON DISK - nothing here is unrun. Nine @ped ratios spanning drift 0.899 to 2.628, plus the
# references the header argues against:
#   omnidata           11.403  drift 0.598   the untransformed prior these arms modify
#   omnidata@ceil1p45   3.830  drift 0.990   the clamp at its own optimum - the tie
#   omnidata@ceil1p4    3.963  drift 1.064   the clamp's other side, for the local slope
#   vggt_base          15.627  drift 0.507
#   vggt_base@ped1      3.687  drift 0.989   mean of FOUR draws (std 0.075) - the third family
END2END_PRIORS: [omnidata, omnidata@ceil1p45, omnidata@ceil1p4, vggt_base, vggt_base@ped1, omnidata@ped2, omnidata@ped1p8, omnidata@ped1p6, omnidata@ped1p4, omnidata@ped1p2, omnidata@ped1, omnidata@ped0p85, omnidata@ped0p7, omnidata@ped0p6]
SPLIT_AT: null                        # null = the whole run, so [unseen] is empty (12.2)

# ---------------------------------------------------------------- the adapter structure
lora:
  weights: pretrained_models/vggt
  rank: 8
  alpha: 16
  targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
  patch_embed: false                  # false = adapt only the alternating-attention stack

# ---------------------------------------------------------------- online adaptation (stage 1)
# stated in full although STAGES skips the stage: a run config is all-or-nothing (13.7)
online:
  # warm-up: TWO gates - when the adapter starts LEARNING, and when it starts SERVING
  warmup_kf: 12                       # keyframes before the first optimiser step, which lands at +1
  handover_kf: 12                     # keyframes served by the FALLBACK prior; must be >= warmup_kf
  warmup_prior: omnidata              # 'omnidata' = upstream's prior | 'self' = the adapting VGGT
  # schedule
  adapt_style: wonline                # 'online' = the arrival alone | 'wonline' = a sliding window
  steps_per_kf: 5
  window_size: 10                     # 'wonline' ONLY
  batch_size: 2                       # 'wonline' ONLY
  lag: 5                              # keyframes back from the end the target is taken
  # serving
  ceil_ratio: 1.0                     # unread here - the online stage is skipped
  ceil_target: false                  # unread here too (14.6)
  ped_ratio: null                     # unread here too. The pedestals this file sweeps are carried
                                      # by the @ped SPECS above, not by this knob - a spec names
                                      # its own arm directory, which is what lets several ratios
                                      # coexist in one comparison (14.4)
  # sample construction
  context_kf: 0                       # previous KEYFRAMES appended after the target; 0 = monocular
  # optimisation
  lr: 1.0e-4                          # NOT 1e-4 - YAML reads that as a string
  weight_decay: 0.0
  grad_clip: 1.0
  lambda_pose: 1.0
  coupled_scale: true
  min_mask_pixels: 16
  seed: 0
  log_every: 5
  # supervision mask (the same knobs ExtractConfig uses for depth_slam/)
  mask_filter_thresh: 0.005
  mask_min_count: 2
  mask_min_disp_ratio: 0.5
  # the loss gate: skip an arrival whose newest keyframe is not worth training on
  gate_metric: raw                    # 'rel' = flat across a run | 'raw' = drifts with it
  gate_lo: 0.0                        # 0 = off; skip BELOW this - the target already fits
  gate_hi: 0.0                        # 0 = off; skip ABOVE this - the target is broken, not hard
  # output
  checkpoint_every_kf: 0              # 0 = off; N = a loadable adapter dir every N
                                      # adapted keyframes

# ---------------------------------------------------------------- what scores the arms
end2end:
  omni_normal_ckpt: pretrained_models/omnidata_dpt_normal_v2.ckpt
  omni_normal_hw: [512, 512]
